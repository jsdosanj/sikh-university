name = "sikh-university"
account_id = "0d4412e40181808b16cce0225ddb5152"
main = "worker.js"
compatibility_date = "2026-06-14"

# Custom domain. dosanjhlabs.com is in this (Jasvant Dosanjh) account, so on
# `wrangler deploy` Cloudflare provisions the DNS record + edge TLS cert
# automatically. SITE_URL stays unset so auth/magic-links follow the request
# origin — no other change needed.
routes = [
  { pattern = "sikh-university.dosanjhlabs.com", custom_domain = true }
]

# Build the Astro frontend (web/) before deploying; its output is the static site.
[build]
command = "cd web && npm install && npm run build && rm -f dist/assets/data/courses.json"

# Astro build output (web/dist) is served by the assets binding; the Worker handles /api/*.
[assets]
directory = "./web/dist"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "sikh-university"
database_id = "76977fdc-94aa-4088-9572-420d2a0ea329"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "sikh-university-media"

# Workers AI — powers /api/translate (site-UI machine translation; courses stay English).
[ai]
binding = "AI"

# Translation cache: <lang>:<sha256(text)> -> translated string.
[[kv_namespaces]]
binding = "TRANSLATIONS"
id = "a965586c34ed4ddfa6c52754af53083d"

# Non-secret vars. SITE_URL is intentionally omitted so magic-link URLs derive
# from the request origin (works on workers.dev and any custom domain).
[vars]
MAIL_FROM = "Sikh University <login@dosanjhlabs.com>"
# ADMIN_EMAILS and RESEND_API_KEY are Worker secrets (encrypted), set in the dashboard
# under Settings > Variables and Secrets — kept out of source. env.ADMIN_EMAILS reads the
# same whether it's a var or a secret, so no code change is needed.

# Workers Logs: persist console output (errors, magic-link/verify/translate failures)
# so production problems are observable after the fact. Without this, console lines
# only exist during a live `wrangler tail` and otherwise evaporate.
[observability]
enabled = true
head_sampling_rate = 1

# Rate limiting is enforced per-IP in worker.js via an atomic D1 counter (RATE_LIMITS +
# checkRateLimit). The Cloudflare experimental `ratelimit` unsafe-binding was removed
# because it silently failed open in testing (never blocked). Limits stay generous (the
# mission serves camps and gurdwaras behind shared NATs) and the limiter fails open on error.
