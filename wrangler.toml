name = "sikhiuni"
account_id = "751487ee9fad43101841aa2b6aa2c449"
main = "worker.js"
compatibility_date = "2026-06-14"

# Custom domains. sikhiuni.com is the canonical home; sikh-university.com is a
# legacy alias that worker.js 301-redirects to it (see LEGACY_HOSTS). All three
# zones (sikhiuni.com, sikh-university.com) live in this (Contact@sikhism.io)
# account, so `wrangler deploy` provisions their DNS records + edge TLS certs
# automatically. The other legacy host, sikh-university.dosanjhlabs.com, stays on
# the dosanjhlabs.com zone in the old (Jasvant Dosanjh) account and is handled by
# a Cloudflare Redirect Rule there, not by this Worker.
# SITE_URL stays unset so auth/magic-links follow the request origin.
routes = [
  { pattern = "sikhiuni.com", custom_domain = true },
  { pattern = "sikh-university.com", custom_domain = true },
  { pattern = "www.sikh-university.com", custom_domain = true }
]

# Build the Astro frontend (web/) before deploying; its output is the static site.
[build]
command = "cd web && npm install && npm run build && rm -f dist/assets/data/courses.json"

# Astro build output (web/dist) is served by the assets binding; the Worker handles /api/*.
[assets]
directory = "./web/dist"
binding = "ASSETS"
# /technology/* routes through the Worker first so it can augment the asset
# layer's own (hash-hardened) CSP for the code lab — 'wasm-unsafe-eval' + the
# Pyodide CDN in script-src/connect-src, and frame-src 'self' for the sandboxed
# preview iframe. Everything else the site forbids stays forbidden. Every other
# path is still served straight from the edge (Worker skipped). The legacy
# /institute prefix stays in the list so the Worker runs to 301 it to
# /technology (the wing was renamed 2026-08).
run_worker_first = ["/technology", "/technology/*", "/institute", "/institute/*", "/_lab/*"]

[[d1_databases]]
binding = "DB"
database_name = "sikh-university"
database_id = "b8300881-b5de-4136-a6fd-00fe9cc2ce02"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "sikh-university-media"

# Workers AI — powers /api/translate (site-UI machine translation; courses stay English).
[ai]
binding = "AI"

# Translation cache: <lang>:<sha256(text)> -> translated string.
[[kv_namespaces]]
binding = "TRANSLATIONS"
id = "32b7aaabd0414d7e9bbe07c3db63ab49"

# Non-secret vars. SITE_URL is intentionally omitted so magic-link URLs derive
# from the request origin (works on workers.dev and any custom domain).
[vars]
# Sender stays on the Resend-verified dosanjhlabs.com domain; switching to
# login@sikhiuni.com requires verifying sikhiuni.com in Resend first (see docs/DEPLOY.md).
MAIL_FROM = "Sikhi University <login@dosanjhlabs.com>"
# ADMIN_EMAILS and RESEND_API_KEY are Worker secrets (encrypted), set in the dashboard
# under Settings > Variables and Secrets — kept out of source. env.ADMIN_EMAILS reads the
# same whether it's a var or a secret, so no code change is needed.

# Daily coursework-reminder push sweep (16:00 UTC). No-op until the VAPID
# secrets exist (see docs/DEPLOY.md → "Web Push reminders").
[triggers]
crons = ["0 16 * * *"]

# Workers Logs: persist console output (errors, magic-link/verify/translate failures)
# so production problems are observable after the fact. Without this, console lines
# only exist during a live `wrangler tail` and otherwise evaporate.
[observability]
enabled = true
head_sampling_rate = 1

# Rate limiting is enforced per-IP in worker.js via an atomic D1 counter (RATE_LIMITS +
# checkRateLimit). The Cloudflare experimental `ratelimit` unsafe-binding was removed
# because it silently failed open in testing (never blocked). Limits stay generous (the
# mission serves camps and gurdwaras behind shared NATs) and the limiter fails open on error.
